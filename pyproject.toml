[project]
name = "ref-do-something"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jeetmitra01", email = "jeetmitra01@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pymupdf==2.0.*",
]

[project.scripts]
ref-do-something = "ref_do_something:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # pymupdf's SWIG bindings warn on import under Python 3.13; not ours to fix.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
markers = [
    "pdf: needs the IFAB PDF in data/raw/ (skipped when it is absent)",
]
